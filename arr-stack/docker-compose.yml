services:

  # ─── VPN ─── Gluetun (Pasarela de red cifrada con kill-switch) ──────────────
  vpn:
    image: qmcgaw/gluetun
    container_name: gluetun_vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-custom}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - TZ=Europe/Madrid
      - DNS_KEEP_NAMESERVERS=on
      - BLOCK_MALICIOUS=off
      - HTTPPROXY=on
    volumes:
      - ./config/vpn:/gluetun
    ports:
      - "8090:8090"   # qBittorrent WebUI (expuesto a través del contenedor VPN)
    restart: always

  # ─── CLIENTE DE DESCARGAS ─── qBittorrent (Tráfico enrutado por VPN) ────────
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - WEBUI_PORT=8090
    volumes:
      - ./config/qbittorrent:/config
      - ${STORAGE_PATH:-/mnt/storage}:/storage
    depends_on:
      - vpn
    restart: unless-stopped

  # ─── INDEXADORES Y RESOLUCIÓN ─────────────────────────────────────────────
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    dns:
      - 1.1.1.1
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/jackett:/config
    ports:
      - "9117:9117"
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
    ports:
      - "8191:8191"
    restart: unless-stopped

  # ─── GESTORES DE CONTENIDO (*ARR) ─────────────────────────────────────────
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/sonarr:/config
      - ${STORAGE_PATH:-/mnt/storage}:/storage
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/radarr:/config
      - ${STORAGE_PATH:-/mnt/storage}:/storage
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config/bazarr:/config
      - ${STORAGE_PATH:-/mnt/storage}:/storage
    ports:
      - "6767:6767"
    restart: unless-stopped

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
    volumes:
      - ./config/jellyseerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  unpackerr:
    image: golift/unpackerr
    container_name: unpackerr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${UN_SONARR_API_KEY}
      - UN_SONARR_0_PATHS_0=/storage/downloads/tv
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${UN_RADARR_API_KEY}
      - UN_RADARR_0_PATHS_0=/storage/downloads/movies
    volumes:
      - ./config/unpackerr:/config
      - ${STORAGE_PATH:-/mnt/storage}:/storage
    restart: unless-stopped

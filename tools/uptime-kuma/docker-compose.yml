# =============================================================================
#  tools/uptime-kuma — Monitorización de Disponibilidad y Alertas
# =============================================================================
services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3002:3001"
    restart: unless-stopped

# =============================================================================
#  tools/filebrowser — Administrador de Archivos Web
# =============================================================================
services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ${HOME}:/srv/home
      - ${STORAGE_PATH:-/mnt/storage}:/srv/storage
      - ./config:/config
    environment:
      - FB_BASEURL=/
      - FB_DATABASE=/config/filebrowser.db

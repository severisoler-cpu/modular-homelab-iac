# =============================================================================
#  tools/gitea — Servidor Git Privado Autoalojado
# =============================================================================
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-server.local}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-http://server.local:3050/}
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - ./data:/data
    ports:
      - "3050:3000"

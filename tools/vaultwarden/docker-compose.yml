# =============================================================================
#  tools/vaultwarden — Gestor de Contraseñas Seguro (Compatible con Bitwarden)
# =============================================================================
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - ENABLE_DB_WAL=true     # Protege SQLite contra corrupción durante snapshots
      - SIGNUPS_ALLOWED=false   # Registro público cerrado
    volumes:
      - ./data:/data
    ports:
      - "8082:80"

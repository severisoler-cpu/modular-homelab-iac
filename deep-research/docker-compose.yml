# =============================================================================
#  deep-research — Motor Autónomo de Investigación Profunda (GPT-Researcher)
#  Soporta tanto modelos Cloud (OpenAI, Gemini, Claude) como locales (Ollama).
# =============================================================================
services:

  deep-researcher:
    image: gptresearcher/gpt-researcher:latest
    container_name: deep-researcher
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # --- Motor de Búsqueda Web ---
      - RETRIEVER=${RETRIEVER:-duckduckgo}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}

      # --- Configuración LLM (Cloud o Local vía Ollama) ---
      - SMART_LLM=${SMART_LLM:-openai:gpt-4o}
      - FAST_LLM=${FAST_LLM:-openai:gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}

      # --- Proveedor de Embeddings ---
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.50:11434}

      # --- Parámetros de Ejecución ---
      - TOTAL_WORDS=${TOTAL_WORDS:-1200}
      - MAX_SUBTOPICS=${MAX_SUBTOPICS:-4}
      - REPORT_FORMAT=${REPORT_FORMAT:-markdown}
    volumes:
      - ./outputs:/usr/src/app/outputs:rw
      - ./my-docs:/usr/src/app/my-docs:rw
